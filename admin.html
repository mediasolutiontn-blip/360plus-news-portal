
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360+ NEWS ADMIN</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  background: #eef2f7;
  font-family: Arial, sans-serif;
  color: #172b4d;
}

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 28px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 5px 20px #0002;
}

h2 {
  text-align: center;
  color: #0756a5;
  margin-top: 5px;
}

label {
  display: block;
  margin-top: 17px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 145px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #087bd1;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.note {
  color: #666;
  font-size: 13px;
  margin-top: 7px;
}

.status {
  text-align: center;
  font-weight: bold;
  margin-top: 18px;
}

#newsPanel { display: none; }
</style>
</head>

<body>

<div class="container" id="loginPanel">
  <h2>360+ NEWS ADMIN LOGIN</h2>

  <label>Username</label>
  <input id="username" type="text">

  <label>Password</label>
  <input id="password" type="password">

  <button type="button" onclick="login()">LOGIN</button>
  <p class="status" id="loginStatus"></p>
</div>

<div class="container" id="newsPanel">
  <h2>360+ NEWS – ADMIN PANEL</h2>

  <form id="newsForm"
    action="https://script.google.com/macros/s/AKfycbwaMAnLd3ZmSstOjSTV1S-ZBsOq84ZffXj43e3fzXWezihIgILOH7Ld-BJogmlMR0wz/exec"
    method="POST"
    target="submitFrame">

    <label>மாவட்டம்</label>
    <select name="district" required>
      <option value="">மாவட்டத்தைத் தேர்வு செய்யவும்</option>
      <option value="திருப்பத்தூர்">திருப்பத்தூர்</option>
      <option value="ராணிப்பேட்டை">ராணிப்பேட்டை</option>
    </select>

    <label>செய்தி தலைப்பு</label>
    <input name="title" type="text"
      placeholder="செய்தி தலைப்பு" required>

    <label>செய்தி விவரம்</label>
    <textarea name="details"
      placeholder="செய்தி விவரங்களை எழுதவும்"></textarea>

    <label>செய்தி புகைப்படம் – Image URL</label>
    <input name="imageUrl" type="url"
      placeholder="https://example.com/photo.jpg">

    <p class="note">
      புகைப்படத்தின் நேரடி இணையதள URL-ஐ இங்கே Paste செய்யவும்.
    </p>

    <label>செய்தி தேதி</label>
    <input type="date" name="date" id="newsDate" required>

    <button type="submit" id="submitButton">
      செய்தியை Submit செய்யவும்
    </button>
  </form>

  <p class="status" id="submitStatus"></p>

  <iframe name="submitFrame" id="submitFrame"
    style="display:none"></iframe>
</div>

<script>
function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  if (username === "admin" && password === "360plus@2026") {
    document.getElementById("loginPanel").style.display = "none";
    document.getElementById("newsPanel").style.display = "block";
    setToday();
  } else {
    document.getElementById("loginStatus").textContent =
      "Username அல்லது Password தவறு.";
  }
}

function setToday() {
  const now = new Date();
  const today = new Date(
    now.getTime() - now.getTimezoneOffset() * 60000
  ).toISOString().slice(0, 10);

  document.getElementById("newsDate").value = today;
}

let submitting = false;

document.getElementById("newsForm").addEventListener("submit", function() {
  submitting = true;

  document.getElementById("submitButton").disabled = true;
  document.getElementById("submitStatus").textContent =
    "செய்தி அனுப்பப்படுகிறது...";
});

document.getElementById("submitFrame").addEventListener("load", function() {
  if (!submitting) return;

  submitting = false;

  document.getElementById("submitStatus").textContent =
    "அனுப்பும் கோரிக்கை முடிந்தது. Google Sheet-ல் சரிபார்க்கவும்.";

  document.getElementById("newsForm").reset();
  setToday();

  document.getElementById("submitButton").disabled = false;
});
</script>

</body>
</html>
